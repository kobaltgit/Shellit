name: shellit_sync_server
description: Lightweight, self-hosted E2EE sync server for Shellit.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.0
  sqlite3: ^2.4.0
  path: ^1.9.0
  crypto: ^3.0.3

dev_dependencies:
  storage_vault:
    path: ../../packages/storage_vault
  lints: ^3.0.0
  test: ^1.24.0
  http: ^1.2.0
