<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Hexagon / Rounded Card -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0D0F18" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Circuit Traces -->
  <path d="M 12 24 L 22 24 L 28 32 L 22 40 L 12 40" fill="none" stroke="#252A40" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 52 24 L 42 24 L 36 32 L 42 40 L 52 40" fill="none" stroke="#252A40" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 32 12 L 32 20" fill="none" stroke="#252A40" stroke-width="1.5" />
  <path d="M 32 44 L 32 52" fill="none" stroke="#252A40" stroke-width="1.5" />

  <!-- Neural Connection Nodes -->
  <circle cx="12" cy="24" r="2.5" fill="#00F0FF" />
  <circle cx="12" cy="40" r="2.5" fill="#A855F7" />
  <circle cx="52" cy="24" r="2.5" fill="#00F0FF" />
  <circle cx="52" cy="40" r="2.5" fill="#FF0080" />
  <circle cx="32" cy="12" r="2.5" fill="#00F0FF" />
  <circle cx="32" cy="52" r="2.5" fill="#A855F7" />

  <!-- Central Processor Diamond / Neural Core -->
  <polygon points="32,20 44,32 32,44 20,32" fill="#141829" stroke="url(#cyberGradient)" stroke-width="2" filter="url(#glow)" />

  <!-- Inner Synapse / Prompt Symbol -->
  <path d="M 28 29 L 33 32 L 28 35" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="34" y1="35" x2="38" y2="35" stroke="#FF0080" stroke-width="2" stroke-linecap="round" />
</svg>
