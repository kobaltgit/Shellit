<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shellit — AI Activity Monitor (Detached)</title>
  <style>
    :root {
      --bg-base: #0B0D14;
      --bg-surface: #121520;
      --bg-card: #181C2B;
      --bg-card-hover: #1E2336;
      --border: #262B3F;
      --border-accent: rgba(0, 240, 255, 0.4);
      --text-main: #E2E8F0;
      --text-muted: #8892B0;
      --text-dim: #5A6482;
      --accent-cyan: #00F0FF;
      --accent-purple: #A855F7;
      --accent-green: #10B981;
      --accent-red: #EF4444;
      --accent-amber: #F59E0B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-size: 13px;
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: text;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Header */
    header {
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .header-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .header-title {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-main);
      letter-spacing: 0.3px;
    }

    .header-sub {
      font-size: 11px;
      color: var(--accent-cyan);
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-badge.stopped {
      background: rgba(239, 68, 68, 0.12);
      color: var(--accent-red);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* Controls Bar */
    .controls-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .controls-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 280px;
    }

    .search-input {
      background: var(--bg-base);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      outline: none;
      width: 100%;
      max-width: 320px;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
    }

    .filter-btn {
      background: var(--bg-base);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .filter-btn.active {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: var(--bg-card-hover);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn:hover {
      background: var(--border);
      border-color: var(--text-muted);
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(168, 85, 247, 0.2));
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.3), rgba(168, 85, 247, 0.3));
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input {
      accent-color: var(--accent-cyan);
    }

    /* Logs Container */
    .logs-wrapper {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .log-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 0 8px 8px 0;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.1s, border-color 0.15s;
    }

    .log-card:hover {
      border-color: var(--border-accent);
    }

    .log-card.error {
      border-left-color: var(--accent-red);
    }

    .log-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .log-meta-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .log-tool {
      font-family: monospace;
      font-weight: 700;
      font-size: 13px;
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    .log-tool.error {
      color: var(--accent-red);
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.2);
    }

    .log-client {
      font-weight: 600;
      font-size: 12px;
      color: var(--text-main);
    }

    .log-time {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-muted);
    }

    .log-status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .log-status-badge.success {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .log-status-badge.failed {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .log-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin-bottom: 2px;
    }

    .code-block {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 280px;
      overflow-y: auto;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 12px;
      padding: 40px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--accent-cyan);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      font-size: 12px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="icon.svg" class="header-icon" alt="Shellit MCP">
      <div class="header-title-wrap">
        <span class="header-title">Shellit AI Activity Monitor</span>
        <span class="header-sub">STANDALONE DETACHED WINDOW</span>
      </div>
    </div>
    <div class="header-right">
      <div id="statusBadge" class="status-badge">
        <div class="status-dot"></div>
        <span id="statusText">ACTIVE</span>
      </div>
      <span id="clientsCount" style="color: var(--accent-cyan); font-family: monospace; font-size: 12px;">0 clients</span>
    </div>
  </header>

  <div class="controls-bar">
    <div class="controls-left">
      <input type="text" id="searchInput" class="search-input" placeholder="Search tool, command, or output...">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="success">Success</button>
      <button class="filter-btn" data-filter="error">Errors</button>
      <label class="checkbox-label">
        <input type="checkbox" id="autoScrollCheck" checked>
        <span>Auto-scroll to top</span>
      </label>
    </div>
    <div class="controls-right">
      <button id="exportLogsBtn" class="btn btn-primary">📥 Save Logs (.log)</button>
      <button id="copyAllBtn" class="btn">📋 Copy All</button>
      <button id="clearLogsBtn" class="btn">🧹 Clear</button>
    </div>
  </div>

  <div id="logsWrapper" class="logs-wrapper">
    <div class="empty-state">
      <span>Listening for tool execution calls from AI clients (Antigravity, Cursor, Claude, Windsurf)...</span>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="logs.js"></script>
</body>
</html>
